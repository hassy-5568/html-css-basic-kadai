<!DOCTYPE html>
<html>
<head>
  <title>5章課題</title>
  <meta name="description" content="このページは5章の課題です。">
  <meta charset="UTF-8">
</head>
<body>
  <!-- これって<header>タグ使わないの？ -->
  <h1>私の趣味</h1>
  <p>私は中学時代にサッカーを始めました。<br>
    現在はサッカーのコーチとして活動をして、趣味のサッカーを楽しんでいます。
  </p>
  <!--　alt属性は、スクリーンリーダーに反応するため、読み上げソフトが読み上げてくれる。  -->
  <!-- アクセシビリティを高めるには、画像の詳細を伝わりやすく書く必要がある -->
  <!-- リンク先も、画像がない場合はaria-label="公式HPを開く"みたいに書くことができる。 -->
  <img src="../images/sample.jpg" alt="サッカーボールの画像">
  <!-- ここって<p>タグの方がよいのかな？ -->
  <br><a href="https://x.com/samuraijuku">私のプロフィールはこちら</a>
</body>
</html>
